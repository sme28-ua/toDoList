name: Developer tests

on: push

jobs:
  launch-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: mads_test
          POSTGRES_USER: mads
          POSTGRES_PASSWORD: mads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mads -d mads_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Launch tests with Maven
        run: mvn test
