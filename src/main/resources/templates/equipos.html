<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Equipos')"></head>
<body>
<div th:replace="fragments :: navbar"></div>

<div class="container my-4">
    <h2 class="mb-4">Listado de Equipos</h2>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${session.idUsuarioLogeado != null}" class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Crear un equipo</h5>
            <form method="post" th:action="@{/equipos}">
                <div class="form-group">
                    <label for="nombre">Nombre del equipo</label>
                    <input id="nombre" name="nombre" type="text" class="form-control"
                           placeholder="Nombre del equipo" required>
                </div>
                <button type="submit" class="btn btn-primary">Crear equipo</button>
            </form>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre del Equipo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.id}">1</td>
            <td>
                <a th:href="@{/equipos/{id}(id=${equipo.id})}"
                   th:text="${equipo.nombre}">Nombre de equipo</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(equipos)}">
            <td colspan="2" class="text-center text-muted">No hay equipos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
