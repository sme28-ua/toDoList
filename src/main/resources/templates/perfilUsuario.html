<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(titulo='Perfil de Usuario')"></head>
<body>

<nav th:replace="fragments :: navbar"></nav>

<div class="container my-4">
    <h2>Perfil de Usuario</h2>

    <div class="card mt-3" style="max-width: 500px;">
        <div class="card-body">
            <h5 class="card-title" th:text="${usuario.nombre}">Nombre del Usuario</h5>
            <p class="card-text">
                <strong>Email:</strong> <span th:text="${usuario.email}">email@ua.es</span><br>
                <strong>Fecha de Nacimiento:</strong>
                <span th:text="${#dates.format(usuario.fechaNacimiento, 'dd/MM/yyyy')}">01/01/2000</span>
            </p>
            <a th:href="@{/registrados}" class="btn btn-secondary btn-sm">Volver al listado</a>
        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
